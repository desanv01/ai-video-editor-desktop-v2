name: Historical RC8 CI (manual archival check)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-v2-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    name: Windows desktop and Rust checks
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: v2.0.0-rc.8

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Check Rust shell
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build React and TypeScript frontend
        run: npm run build --prefix desktop

      - name: Build unsigned RC8 NSIS installer for production checks
        run: npm run build:nsis:checked --prefix desktop

      - name: Run desktop contract and installer checks
        run: npm test --prefix desktop

      - name: Execute built installer lifecycle on disposable runner
        shell: powershell
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Built NSIS installer missing.' }
          & ./scripts/desktop-v2/Test-ActualInstallerLifecycle.ps1 -Installer $installer.FullName -EvidenceDir "$env:RUNNER_TEMP/rc8-lifecycle"

      - name: Preserve exact tested installer and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc8-tested-installer-${{ github.run_id }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*setup.exe
            ${{ runner.temp }}/rc8-lifecycle/*
          if-no-files-found: warn
          retention-days: 14

  windows-backend:
    name: Windows backend unit tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: v2.0.0-rc.8

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend unit tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"
