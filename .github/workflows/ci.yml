name: Desktop V2 CI

on:
  push:
    branches:
      - main
      - "codex/desktop-v2-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-v2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    name: Windows desktop and Rust checks
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Check Rust shell
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build React and TypeScript frontend
        run: npm run build --prefix desktop

      - name: Build unsigned RC6 NSIS source for installer checks
        working-directory: desktop
        run: npx tauri build --bundles nsis --no-sign

      - name: Run desktop contract and installer checks
        run: npm test --prefix desktop

  windows-backend:
    name: Windows backend unit tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend unit tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"