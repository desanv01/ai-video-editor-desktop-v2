name: Aivora Desktop CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    name: Windows Electron build and boundary checks
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend and Electron controller
        run: npm run build
      - name: Run focused controller boundary checks
        run: npm run test:rebuild
      - name: Verify current teacher-reviewed export summary
        run: node ../scripts/rebuild/test_export_duration.cjs .. ../.test-output/export-duration
      - name: Verify generated educational cards stay inside chapter and lecture boundaries
        run: node ../scripts/rebuild/test_generated_card_timing.cjs .. ../.test-output/generated-card-timing
      - name: Prepare pinned Electron interaction runtime
        run: node node_modules/electron/install.js
      - name: Verify failed-render project recovery and stale navigation boundaries
        run: node ../scripts/rebuild/test_dashboard_reopen.cjs .. ../.test-output/dashboard-reopen
      - name: Verify material indexing feedback and stale response boundaries
        run: node ../scripts/rebuild/test_material_feedback.cjs .. ../.test-output/material-feedback
      - name: Run immutable component update and legacy activation checks
        run: node ../scripts/rebuild/test_component_updates.cjs ..
      - name: Run native and browser transcript download boundary checks
        run: node ../scripts/rebuild/test_phase4_downloads.cjs ..
      - name: Run vault, private credential synchronization and renderer boundaries
        run: node ../scripts/rebuild/test_provider_credentials.cjs ..
      - name: Run owned process close and main lifecycle queue checks
        run: |
          node ../scripts/rebuild/test_lifecycle_supervisor.cjs ..
          node ../scripts/rebuild/test_lifecycle_main.cjs ..
      - name: Package assisted per-user installer
        run: npm run package:win
      - name: Verify actual unpacked window and preload
        run: node ../scripts/rebuild/phase2-electron-smoke.cjs .. ../.test-output/playwright/phase2
      - name: Record immutable artifact identities
        run: |
          $installers = @(Get-ChildItem release-electron -Filter '*Setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $record = @{ schemaVersion='aive.ci-build.v1'; commit='${{ github.sha }}'; runId='${{ github.run_id }}'; runUrl='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'; installer=$installer.Name; bytes=$installer.Length; sha256=$hash; qualification='Engineering installer with verified component manifest; runtime archives not bundled in CI; no installed workflow acceptance' }
          $record | ConvertTo-Json | Set-Content release-electron/ci-build.json
          "$hash  $($installer.Name)" | Set-Content release-electron/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aive-phase2-windows-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/release-electron/*Setup.exe
            desktop/release-electron/*Setup.exe.blockmap
            desktop/release-electron/ci-build.json
            desktop/release-electron/SHA256SUMS.txt
            .test-output/playwright/phase2/electron-smoke.json
            .test-output/playwright/phase2/setup*.png
  backend:
    name: Windows preserved backend unit tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify final delivery assembly boundaries
        env:
          AIVE_REBUILD_ROOT: ${{ github.workspace }}
        run: |
          python scripts/rebuild/test_delivery.py
          python scripts/rebuild/test_tool_packs.py
          python scripts/rebuild/test_application_notices.py --repo . --output .test-output/application-notices
      - name: Acquire exact managed FFmpeg 8.1.1 for preserved export tests
        shell: pwsh
        run: |
          $managedMediaRoot = Join-Path $env:GITHUB_WORKSPACE '.test-output/managed-ffmpeg-8.1.1'
          if (Test-Path -LiteralPath $managedMediaRoot) { throw 'Managed media output must be fresh' }
          New-Item -ItemType Directory -Path $managedMediaRoot | Out-Null
          $managedMediaArchive = Join-Path $managedMediaRoot 'ffmpeg-8.1.1-full_build.zip'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/8.1.1/ffmpeg-8.1.1-full_build.zip' -OutFile $managedMediaArchive
          if ((Get-Item -LiteralPath $managedMediaArchive).Length -ne 252194496) { throw 'Managed FFmpeg archive size mismatch' }
          if ((Get-FileHash -LiteralPath $managedMediaArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '49b28c5f16addd40239a66949973458769b7056fb7752c30ac0d53389d09a552') { throw 'Managed FFmpeg archive hash mismatch' }
          Expand-Archive -LiteralPath $managedMediaArchive -DestinationPath (Join-Path $managedMediaRoot 'runtime')
          $managedFfmpeg = @(Get-ChildItem -LiteralPath (Join-Path $managedMediaRoot 'runtime') -Recurse -File -Filter 'ffmpeg.exe')
          $managedFfprobe = @(Get-ChildItem -LiteralPath (Join-Path $managedMediaRoot 'runtime') -Recurse -File -Filter 'ffprobe.exe')
          if ($managedFfmpeg.Count -ne 1 -or $managedFfprobe.Count -ne 1 -or $managedFfmpeg[0].DirectoryName -ne $managedFfprobe[0].DirectoryName) { throw 'Expected exact shared media bin directory' }
          if ((Get-FileHash -LiteralPath $managedFfmpeg[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne '09948d4cdd0650da6ff5a87577469f2a218dc2615ae379f8f734d24c49de0f73') { throw 'Managed ffmpeg executable hash mismatch' }
          if ((Get-FileHash -LiteralPath $managedFfprobe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a6618e99bb58869ded3c6f37b53aa1a8d701c3591dbb7b5b317d47369c112be2') { throw 'Managed ffprobe executable hash mismatch' }
          $managedVersion = & $managedFfmpeg[0].FullName -version
          if ($LASTEXITCODE -ne 0 -or $managedVersion[0] -notmatch '^ffmpeg version 8[.]1[.]1(?:-|\s)') { throw 'Managed media version mismatch' }
          $managedFfmpeg[0].DirectoryName | Out-File -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Append
          @{ sourceCommit='239f2c733de417201d7ad3b3b8b0d9b63285b2b1'; version='8.1.1'; archiveSha256='49b28c5f16addd40239a66949973458769b7056fb7752c30ac0d53389d09a552'; scope='Managed CI compositor tests; installed export acceptance remains separate' } | ConvertTo-Json | Set-Content (Join-Path $managedMediaRoot 'identity.json')
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-rebuild-storage.txt
      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Run real LanceDB and SQLite acceptance checks
        run: python scripts/rebuild/test_rebuild_storage.py
      - name: Verify isolated document profile alias identity and fallback guards
        run: python scripts/rebuild/test_document_profile.py --repo . --output .test-output/document-profile
      - name: Run native startup and resource lifecycle checks
        run: python scripts/rebuild/test_rebuild_runtime.py
      - name: Run native agent transaction acceptance checks
        run: python scripts/rebuild/test_agent_transactions.py

      - name: Run native visual analysis transaction acceptance checks
        run: python scripts/rebuild/test_visual_transactions.py
      - name: Run native planning, teacher race and caller acceptance checks
        run: python scripts/rebuild/test_plan_transactions.py

      - name: Verify actual native video status polling and export job compatibility
        run: python scripts/rebuild/test_video_status_api.py
      - name: Run native original transcript API acceptance checks
        run: python scripts/rebuild/test_transcript_api.py

      - name: Run native credential ASGI and SQLite security acceptance
        run: python scripts/rebuild/test_provider_credentials.py

      - name: Verify installed intake, readiness and credential regressions
        run: python scripts/rebuild/test_installed_boundaries.py --repo . --output .test-output/installed-boundaries

      - name: Verify timeline evidence matches canonical current source and output ranges
        run: python scripts/rebuild/test_evidence_timeline.py --repo . --output .test-output/evidence-timeline

      - name: Verify teacher-reviewed report duration and timing provenance
        run: python scripts/rebuild/test_report_metrics.py --repo . --output .test-output/report-metrics

      - name: Verify durable manual workflow progress without approval side effects
        run: python scripts/rebuild/test_workflow_progress.py --repo . --output .test-output/workflow-progress

      - name: Verify actual Windows subtitle and ASS path escaping
        shell: pwsh
        run: |
          $subtitleMediaRoot = Split-Path -Parent (Split-Path -Parent (Get-Command ffmpeg.exe).Source)
          python scripts/rebuild/test_subtitle_paths.py --repo . --output .test-output/subtitle-paths --ffmpeg-root $subtitleMediaRoot

      - name: Verify actual end-card render matches the prepared lecture canvas
        shell: pwsh
        run: |
          $endCardMediaRoot = Split-Path -Parent (Split-Path -Parent (Get-Command ffmpeg.exe).Source)
          python scripts/rebuild/test_end_card_canvas.py --repo . --output .test-output/end-card-canvas --ffmpeg-root $endCardMediaRoot

      - name: Verify selected caption size and safe margins on actual video canvases
        shell: pwsh
        run: |
          $captionMediaRoot = Split-Path -Parent (Split-Path -Parent (Get-Command ffmpeg.exe).Source)
          python scripts/rebuild/test_caption_canvas.py --repo . --output .test-output/caption-canvas --ffmpeg-root $captionMediaRoot
