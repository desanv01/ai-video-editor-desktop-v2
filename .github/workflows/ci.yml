name: AIVE Electron Rebuild CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    name: Windows Electron build and boundary checks
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend and Electron controller
        run: npm run build
      - name: Run focused controller boundary checks
        run: npm run test:rebuild
      - name: Run native and browser transcript download boundary checks
        run: node ../scripts/rebuild/test_phase4_downloads.cjs ..
      - name: Package assisted per-user installer
        run: npm run package:win
      - name: Verify actual unpacked window and preload
        run: node ../scripts/rebuild/phase2-electron-smoke.cjs .. ../.test-output/playwright/phase2
      - name: Record immutable artifact identities
        run: |
          $installers = @(Get-ChildItem release-electron -Filter '*Setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $record = @{ schemaVersion='aive.ci-build.v1'; commit='${{ github.sha }}'; runId='${{ github.run_id }}'; runUrl='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'; installer=$installer.Name; bytes=$installer.Length; sha256=$hash; qualification='Phase2 engineering shell; runtime packs unconfigured; no installed workflow acceptance' }
          $record | ConvertTo-Json | Set-Content release-electron/ci-build.json
          "$hash  $($installer.Name)" | Set-Content release-electron/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aive-phase2-windows-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/release-electron/*Setup.exe
            desktop/release-electron/*Setup.exe.blockmap
            desktop/release-electron/ci-build.json
            desktop/release-electron/SHA256SUMS.txt
            .test-output/playwright/phase2/electron-smoke.json
            .test-output/playwright/phase2/setup*.png
  backend:
    name: Windows preserved backend unit tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-rebuild-storage.txt
      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Run real LanceDB and SQLite acceptance checks
        run: python scripts/rebuild/test_rebuild_storage.py
      - name: Run native startup and resource lifecycle checks
        run: python scripts/rebuild/test_rebuild_runtime.py
      - name: Run native agent transaction acceptance checks
        run: python scripts/rebuild/test_agent_transactions.py

      - name: Run native visual analysis transaction acceptance checks
        run: python scripts/rebuild/test_visual_transactions.py
      - name: Run native planning, teacher race and caller acceptance checks
        run: python scripts/rebuild/test_plan_transactions.py

      - name: Run native original transcript API acceptance checks
        run: python scripts/rebuild/test_transcript_api.py
