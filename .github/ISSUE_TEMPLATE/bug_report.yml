name: Bug report
description: Report a reproducible problem in Aivora.
body:
  - type: input
    id: version
    attributes:
      label: App version and Windows version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the editing stage and component/provider mode. Remove credentials and private media.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or screenshots
