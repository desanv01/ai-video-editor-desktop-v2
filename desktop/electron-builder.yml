appId: com.aive.desktop.rebuild
productName: Aivora
asar: true
# Keep appId stable so upgrades retain the installed application identity.
directories:
  output: release-electron
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!**/.env*'
  - '!src-tauri/**'
  - '!**/credentials.json'
  - '!node_modules/@ffmpeg-installer/**'
  - '!node_modules/@ffprobe-installer/**'
  - '!node_modules/@esbuild/**'
extraResources:
  - from: ../contracts/rebuild/components.json
    to: rebuild/components.json
  - offline-components/aive-engine-2.1.0-rebuild.2-win32-x64.zip
  - offline-components/whisper-small-1.9.4-b5130-small-win32-x64.zip
win:
  icon: public/aivora-icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Aivora-${version}-${arch}-Setup.${ext}
nsis:
  include: installer/integrated-setup.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

