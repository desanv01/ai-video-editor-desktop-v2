appId: com.aive.desktop.rebuild
productName: Aivora
asar: true
# Keep appId stable so upgrades retain the installed application identity.
directories:
  output: release-electron
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!**/.env*'
  - '!src-tauri/**'
  - '!**/credentials.json'
extraResources:
  - from: ../contracts/rebuild/components.json
    to: rebuild/components.json
  - offline-components/**
win:
  icon: public/aivora-icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Aivora-${version}-${arch}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

