[package]
name = "ai-video-editor"
version = "1.0.0"
description = "AI-Agent Assisted Video Editing Framework"
authors = ["FYP Student"]
edition = "2021"

[lib]
name = "ai_video_editor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
