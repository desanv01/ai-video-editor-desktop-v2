services:
  # ── FastAPI Backend ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aive-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app
      - ./scripts:/scripts:ro
      - video_storage:/data/videos
      - ./uploads:/data/uploads
    env_file:
      - .env
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
      FFMPEG_HARDWARE_ACCELERATION: ${FFMPEG_HARDWARE_ACCELERATION:-auto}
      FFMPEG_HARDWARE_FALLBACK_TO_CPU: ${FFMPEG_HARDWARE_FALLBACK_TO_CPU:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    # Contain an unexpected native-render leak inside the backend instead of
    # allowing it to exhaust Docker Desktop's entire Linux VM.
    mem_limit: ${BACKEND_MEMORY_LIMIT:-6g}
    pids_limit: 512

  # ── PostgreSQL Database ──
  db:
    image: postgres:16-alpine
    container_name: aive-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aive_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aive_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aive}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Qdrant Vector Database ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aive-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Redis (task queue / caching) ──
  redis:
    image: redis:7-alpine
    container_name: aive-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  redis_data:
  video_storage:
